<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VLM UI 6 - Complex Settings</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #fafafa; color: #333; padding: 40px; }
        .card { background: white; padding: 30px; border-radius: 12px; max-width: 800px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .tabs { display: flex; border-bottom: 2px solid #eee; margin-bottom: 20px; }
        .tab { padding: 10px 20px; cursor: pointer; color: #666; font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -2px; }
        .tab.active { color: #000; border-bottom: 2px solid #3b82f6; }
        .content { display: none; }
        .content.active { display: block; }
        .toggle-row { display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #eee; }
        .save-btn { background: #3b82f6; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; float: right; margin-top: 20px; font-weight: bold; }
        #toast { position: fixed; top: 40px; left: 50%; transform: translateX(-50%); background: #10b981; color: white; padding: 15px 30px; border-radius: 30px; display: none; font-weight: bold; z-index: 1000; }
    </style>
</head>
<body>
    <div id="toast">Saved!</div>
    <div class="card">
        <div class="tabs">
            <div class="tab active" onclick="switchTab('gen')">General</div>
            <div class="tab" onclick="switchTab('sec')">Security</div>
            <div class="tab" onclick="switchTab('bil')">Billing</div>
        </div>
        
        <div id="gen" class="content active">
            <div class="toggle-row">
                <div><strong>Theme</strong><br><small>Switch between light and dark</small></div>
                <select onchange="showToast('Theme set to ' + this.value)"><option>Light</option><option>Dark</option></select>
            </div>
            <div class="toggle-row">
                <div><strong>Language</strong></div>
                <select onchange="showToast('Lang set to ' + this.value)"><option>English</option><option>Spanish</option></select>
            </div>
        </div>

        <div id="sec" class="content">
            <div class="toggle-row">
                <div><strong>Two-Factor Auth</strong><br><small>Requires SMS code</small></div>
                <input type="checkbox" onclick="showToast('2FA Toggled')">
            </div>
            <div class="toggle-row">
                <div><strong>Login Alerts</strong></div>
                <input type="checkbox" checked onclick="showToast('Alerts Toggled')">
            </div>
        </div>

        <div id="bil" class="content">
            <div class="toggle-row">
                <div><strong>Subscription Plan</strong></div>
                <select onchange="showToast('Plan set to ' + this.value)"><option>Monthly - $10</option><option>Annual - $100</option></select>
            </div>
            <button class="save-btn" onclick="showToast('Changes Saved!')">Save Changes</button>
        </div>
    </div>
    <script>
        function showToast(msg) {
            let t = document.getElementById('toast');
            t.innerText = "✅ " + msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2000);
        }
        function switchTab(id) {
            document.querySelectorAll('.tab').forEach(e => e.classList.remove('active'));
            document.querySelectorAll('.content').forEach(e => e.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(id).classList.add('active');
            showToast('Switched Tab');
        }
    </script>
</body>
</html>

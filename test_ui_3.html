<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced VLM Testing UI 3 - Checkout</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #fff1f2; --surface: #ffffff; --primary: #e11d48; --success: #059669; --text: #1f2937; --border: #e5e7eb; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); padding: 40px; display: flex; justify-content: center; }
        .checkout-box { background: var(--surface); padding: 30px; border-radius: 16px; width: 600px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: var(--primary); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 500; font-size: 0.9rem; }
        input[type="text"], input[type="email"], select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; box-sizing: border-box; font-family: inherit; }
        .flex-row { display: flex; gap: 15px; }
        .flex-row .form-group { flex: 1; }
        
        .shipping-method { display: flex; gap: 10px; margin-top: 10px; }
        .method-card { flex: 1; border: 2px solid var(--border); padding: 15px; border-radius: 8px; cursor: pointer; text-align: center; }
        .method-card.active { border-color: var(--primary); background: #fff1f2; color: var(--primary); font-weight: bold; }
        
        .checkout-btn { width: 100%; padding: 16px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 20px; transition: 0.2s; }
        .checkout-btn:hover { background: #be123c; }
        
        /* Success Message Overlay */
        #success-toast {
            position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
            background-color: var(--success); color: white; padding: 16px 32px; border-radius: 50px;
            font-weight: 600; z-index: 1000; transition: top 0.4s;
        }
        #success-toast.show { top: 40px; }
    </style>
</head>
<body>
    <div id="success-toast">Action Registered Successfully!</div>
    
    <div class="checkout-box">
        <h2>Complete Your Order</h2>
        
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="john@example.com">
        </div>
        
        <div class="flex-row">
            <div class="form-group">
                <label>First Name</label>
                <input type="text" id="fname" placeholder="John">
            </div>
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" id="lname" placeholder="Doe">
            </div>
        </div>
        
        <div class="form-group">
            <label>Shipping Method</label>
            <div class="shipping-method">
                <div class="method-card active" onclick="selectMethod(this, 'Standard Shipping')">Standard ($5.00)</div>
                <div class="method-card" onclick="selectMethod(this, 'Express Shipping')">Express ($15.00)</div>
                <div class="method-card" onclick="selectMethod(this, 'Overnight')">Overnight ($30.00)</div>
            </div>
        </div>
        
        <label style="display: flex; align-items: center; gap: 10px; margin-top: 20px; cursor: pointer;">
            <input type="checkbox" id="tos" style="width: 20px; height: 20px;">
            I agree to the Terms of Service
        </label>
        
        <button class="checkout-btn" onclick="submitOrder()">Place Order - $299.00</button>
    </div>

    <script>
        let toastTimeout;
        function triggerSuccess(message) {
            const toast = document.getElementById('success-toast');
            toast.textContent = "✅ " + message;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => { toast.classList.remove('show'); }, 2500);
        }
        
        function selectMethod(element, method) {
            document.querySelectorAll('.method-card').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            triggerSuccess('Selected: ' + method);
        }
        
        function submitOrder() {
            const email = document.getElementById('email').value;
            const tos = document.getElementById('tos').checked;
            if (tos) {
                triggerSuccess('Order Placed! Email: ' + email);
            } else {
                triggerSuccess('ERROR: Must accept TOS!');
            }
        }
    </script>
</body>
</html>

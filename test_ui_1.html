<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced VLM Testing UI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --primary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-muted);
            margin-bottom: 40px;
        }

        .container {
            background-color: var(--surface-color);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 800px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Success Message Overlay */
        #success-toast {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--success);
            color: white;
            padding: 16px 32px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.1rem;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            pointer-events: none;
        }

        #success-toast.show {
            top: 40px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .section {
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .section h2 {
            font-size: 1.2rem;
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        /* Standard Buttons */
        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .btn-primary { background-color: var(--primary); color: white; }
        .btn-primary:hover { background-color: #2563eb; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4); }

        .btn-success { background-color: var(--success); color: white; }
        .btn-success:hover { background-color: #059669; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4); }

        .btn-danger { background-color: var(--danger); color: white; }
        .btn-danger:hover { background-color: #dc2626; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4); }

        /* Scrollable Area & Checkboxes */
        .scroll-box {
            height: 150px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .scroll-box::-webkit-scrollbar {
            width: 8px;
        }
        .scroll-box::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }
        .scroll-box::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
        .scroll-box::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            cursor: pointer;
            padding: 8px;
            border-radius: 6px;
            transition: background 0.2s;
        }
        .checkbox-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .checkbox-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 12px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        /* Dropdown */
        select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-family: inherit;
            font-size: 1rem;
            cursor: pointer;
            outline: none;
        }
        select:focus {
            border-color: var(--primary);
        }
        select option {
            background: var(--surface-color);
        }

        /* 4 Different Shapes */
        .shapes-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 10px;
        }

        .shape {
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        
        .shape:hover {
            transform: scale(1.1) rotate(5deg);
        }

        .shape-square {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border-radius: 8px;
        }

        .shape-circle {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ec4899, #be185d);
            border-radius: 50%;
        }

        .shape-pill {
            width: 80px;
            height: 40px;
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            border-radius: 20px;
        }

        .shape-triangle {
            width: 0;
            height: 0;
            border-left: 35px solid transparent;
            border-right: 35px solid transparent;
            border-bottom: 60px solid #14b8a6;
            position: relative;
            cursor: pointer;
        }
        .shape-triangle:hover {
            border-bottom-color: #0d9488;
        }

    </style>
</head>
<body>

    <div id="success-toast">Action Registered Successfully!</div>

    <h1>VLM Vision Testing Matrix</h1>
    <p class="subtitle">An advanced glassmorphic UI environment designed for testing visual foundation models.</p>

    <div class="container">
        <div class="grid">
            
            <!-- Standard Interactions -->
            <div class="section">
                <h2>Standard Interactions</h2>
                <button class="btn btn-success" onclick="triggerSuccess('Clicked: Green Start Button')">Start Engine</button>
                <button class="btn btn-primary" onclick="triggerSuccess('Clicked: Primary Action')">Primary Action</button>
                <button class="btn btn-danger" onclick="triggerSuccess('Clicked: Danger Delete Button')">Delete Data</button>
                
                <div style="margin-top: 20px;">
                    <select onchange="triggerSuccess('Selected State: ' + this.value)">
                        <option value="" disabled selected>Select a State...</option>
                        <option value="Andhra Pradesh">Andhra Pradesh</option>
                        <option value="Karnataka">Karnataka</option>
                        <option value="Maharashtra">Maharashtra</option>
                        <option value="Tamil Nadu">Tamil Nadu</option>
                    </select>
                </div>
            </div>

            <!-- Scrollable Checkboxes -->
            <div class="section">
                <h2>Feature Selection (Scrollable)</h2>
                <div class="scroll-box">
                    <label class="checkbox-item">
                        <input type="checkbox" onclick="triggerSuccess('Toggled: Auto-Scaling')"> Auto-Scaling
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" onclick="triggerSuccess('Toggled: Cloud Sync')"> Cloud Sync
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" onclick="triggerSuccess('Toggled: Debug Mode')"> Debug Mode
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" onclick="triggerSuccess('Toggled: Dark Theme')"> Dark Theme
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" onclick="triggerSuccess('Toggled: Notifications')"> Notifications
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" onclick="triggerSuccess('Toggled: Telemetry')"> Telemetry
                    </label>
                </div>
            </div>
            
            <!-- Geometric Shapes -->
            <div class="section" style="grid-column: span 2;">
                <h2>Geometric Recognition</h2>
                <div class="shapes-container">
                    <div class="shape shape-square" onclick="triggerSuccess('Clicked: Orange Square')">SQ</div>
                    <div class="shape shape-circle" onclick="triggerSuccess('Clicked: Pink Circle')">CI</div>
                    <div class="shape shape-pill" onclick="triggerSuccess('Clicked: Purple Pill')">PILL</div>
                    <div class="shape shape-triangle" onclick="triggerSuccess('Clicked: Teal Triangle')"></div>
                </div>
            </div>

        </div>
    </div>

    <script>
        let toastTimeout;
        function triggerSuccess(message) {
            const toast = document.getElementById('success-toast');
            toast.textContent = "✅ " + message;
            toast.classList.add('show');
            
            console.log(message); // For debugging
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }
    </script>
</body>
</html>

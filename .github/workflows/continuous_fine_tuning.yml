name: Continuous Dataset Validation & CI/CD Trigger

on:
  push:
    paths:
      - 'live_vlm_dataset/dataset.jsonl'
      - 'live_vlm_dataset/verified_true_cases.jsonl'
    branches:
      - main
  workflow_dispatch:

jobs:
  check-dataset-and-trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Validation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Run CI/CD Pipeline Check
        id: cicd_check
        run: |
          python cicd_pipeline.py --check

      - name: Upload Dataset Artifact (When Milestone Reached)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vlm-dataset-milestone
          path: vlm_dataset.zip
          if-no-files-found: ignore

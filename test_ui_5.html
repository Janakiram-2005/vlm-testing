<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VLM UI 5 - Kanban Board</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: #f8fafc; padding: 40px; }
        .board { display: flex; gap: 20px; }
        .column { background: #1e293b; padding: 15px; border-radius: 8px; width: 300px; min-height: 400px; }
        .column h3 { margin-top: 0; color: #94a3b8; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .ticket { background: #334155; padding: 15px; border-radius: 6px; margin-bottom: 10px; cursor: grab; border-left: 4px solid #3b82f6; }
        .ticket:active { cursor: grabbing; }
        .ticket-title { font-weight: bold; margin-bottom: 5px; }
        #toast { position: fixed; top: 40px; left: 50%; transform: translateX(-50%); background: #10b981; padding: 15px 30px; border-radius: 30px; display: none; font-weight: bold; }
    </style>
</head>
<body>
    <div id="toast">Action Registered!</div>
    <h2>Project Sprint Board</h2>
    
    <div class="board">
        <div class="column" ondrop="drop(event, 'To Do')" ondragover="allowDrop(event)">
            <h3>To Do</h3>
            <div id="tk1" class="ticket" draggable="true" ondragstart="drag(event)"><div class="ticket-title">TKT-101</div>Fix Login Bug</div>
            <div id="tk2" class="ticket" draggable="true" ondragstart="drag(event)"><div class="ticket-title">TKT-102</div>Update API Docs</div>
        </div>
        
        <div class="column" ondrop="drop(event, 'In Progress')" ondragover="allowDrop(event)">
            <h3>In Progress</h3>
            <div id="tk3" class="ticket" draggable="true" ondragstart="drag(event)"><div class="ticket-title">TKT-103</div>Design System</div>
        </div>
        
        <div class="column" ondrop="drop(event, 'Done')" ondragover="allowDrop(event)">
            <h3>Done</h3>
            <div id="tk4" class="ticket" draggable="true" ondragstart="drag(event)"><div class="ticket-title">TKT-100</div>Setup Repo</div>
        </div>
    </div>

    <script>
        function showToast(msg) {
            let t = document.getElementById('toast');
            t.innerText = "✅ " + msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2000);
        }
        function allowDrop(ev) { ev.preventDefault(); }
        function drag(ev) { ev.dataTransfer.setData("text", ev.target.id); }
        function drop(ev, colName) {
            ev.preventDefault();
            var data = ev.dataTransfer.getData("text");
            ev.target.closest('.column').appendChild(document.getElementById(data));
            showToast("Moved to " + colName);
        }
    </script>
</body>
</html>
